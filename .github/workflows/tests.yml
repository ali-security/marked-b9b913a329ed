name: "Tests"
on:
  workflow_dispatch:

jobs:
  # Node 8 is excluded from this job: the pinned dev toolchain hard-fails on it
  # (rollup@2.49.0 declares engines node>=10, and eslint@7.27.0 will not run on Node 8).
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test:unit
      - name: Run Spec Tests
        run: npm run test:specs

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        run: npm pack
      - name: Upload Tarball
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
